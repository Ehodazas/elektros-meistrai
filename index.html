<!doctype html>
<html lang="lt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101D30" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--seo:start-->
    <title>Elektriko paslaugos namams ir verslui | ELEKTROS MEISTRAI</title>
    <meta name="description" content="Elektros instaliacija, gedimų šalinimas, elektros skydų ir apšvietimo montavimas." />
    <!--seo:end-->
    <script>
      // Scroll-reveal: hide [data-reveal] elements before first paint so prerendered content
      // doesn't flash. If the app fails to start within 4 s, show everything.
      (function () {
        try {
          if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
          var d = document.documentElement;
          d.classList.add("reveal-ready");
          setTimeout(function () { if (!window.__appReady) d.classList.remove("reveal-ready"); }, 4000);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"><!--app--></div>
    <noscript><style>.reveal-ready [data-reveal]{opacity:1!important;transform:none!important}</style></noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
