# Deploys to GitHub Pages on every push to main.
# Settings → Pages → Source: "GitHub Actions".
# Settings → Secrets and variables → Actions → Variables:
#   SITE_URL   e.g. https://<user>.github.io/<repo>   (or your own domain)
#   BASE_PATH  e.g. /<repo>/                          (or / for own domain)
#   VITE_FORM_ENDPOINT  optional, e.g. https://formspree.io/f/xxxxxxx
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          BASE_PATH: ${{ vars.BASE_PATH || format('/{0}/', github.event.repository.name) }}
          VITE_FORM_ENDPOINT: ${{ vars.VITE_FORM_ENDPOINT }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
